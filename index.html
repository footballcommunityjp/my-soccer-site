<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FOOTBALL COMMUNITY JP</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           🎨 サイバーネオン・全テーマ完全定義
           ========================================== */
        :root {
            --bg-color: #030712;
            --bg-gradient: radial-gradient(circle at 50% 0%, #0b1528 0%, #030712 100%);
            --grid-color: rgba(0, 255, 204, 0.02);
            --text-color: #ffffff;
            --card-bg: rgba(11, 22, 44, 0.5);
            --card-border: rgba(0, 255, 204, 0.15);
            --card-hover-border: #00ffcc;
            --sub-text: #64748b;
            --panel-bg: rgba(6, 11, 25, 0.96);
            --neon-cyan: #00ffcc;
            --neon-pink: #ff007f;
            --neon-blue: #0077ff;
            --glow-color: rgba(0, 255, 204, 0.3);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        [data-theme="galaxy"] {
            --bg-color: #0b001a;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a0033 0%, #050010 100%);
            --grid-color: rgba(255, 0, 127, 0.03);
            --text-color: #f3e8ff;
            --card-bg: rgba(30, 0, 60, 0.4);
            --card-border: rgba(216, 180, 254, 0.2);
            --card-hover-border: #d8b4fe;
            --sub-text: #a78bfa;
            --panel-bg: rgba(20, 0, 40, 0.98);
            --neon-cyan: #c084fc;
            --neon-pink: #f472b6;
            --neon-blue: #38bdf8;
            --glow-color: rgba(192, 132, 252, 0.4);
        }

        [data-theme="dark"] {
            --bg-color: #000000;
            --bg-gradient: none;
            --grid-color: rgba(255,255,255,0.01);
            --text-color: #ffffff;
            --card-bg: #0d0d0d;
            --card-border: #222222;
            --card-hover-border: #ffffff;
            --sub-text: #64748b;
            --panel-bg: #121212;
            --neon-cyan: #ffffff;
            --neon-pink: #444444;
            --neon-blue: #222222;
            --glow-color: rgba(255,255,255,0.1);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --bg-gradient: linear-gradient(#f1f5f9, #f8fafc);
            --grid-color: rgba(15, 23, 42, 0.02);
            --text-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-hover-border: #3b82f6;
            --sub-text: #64748b;
            --panel-bg: rgba(255, 255, 255, 0.98);
            --neon-cyan: #3b82f6;
            --neon-pink: #ec4899;
            --neon-blue: #06b6d4;
            --glow-color: rgba(59, 130, 246, 0.2);
        }

        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 120px;
            overflow-x: hidden; transition: background 0.5s ease, color 0.5s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header-wrapper {
            width: 100%; background: rgba(3, 7, 18, 0.3);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 25px 20px; box-sizing: border-box;
            position: relative; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .header-main { display: flex; justify-content: center; align-items: center; width: 100%; position: relative; }
        .header-main h1 {
            margin: 0; font-size: 24px; font-weight: 900; letter-spacing: 3px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--glow-color);
        }

        .settings-btn {
            position: absolute; right: 10px; background: none; border: none;
            color: var(--text-color); font-size: 22px; cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 8px; z-index: 1002;
        }
        .settings-btn:hover { transform: rotate(90deg) scale(1.1); color: var(--neon-cyan); }

        .control-panel {
            position: absolute; top: 80px; right: 20px; background: var(--panel-bg);
            border: 1px solid var(--card-border); border-radius: 16px; padding: 20px;
            width: 260px; box-sizing: border-box; display: none; flex-direction: column; gap: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 255, 204, 0.05);
            z-index: 9999; animation: panelSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .control-panel.open { display: flex; }
        @keyframes panelSlide { from { opacity: 0; transform: translateY(-10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .panel-sec h4 { margin: 0 0 10px 0; font-size: 11px; color: var(--neon-cyan); letter-spacing: 1.5px; text-transform: uppercase; }
        .ui-group { display: flex; gap: 6px; }
        .ui-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
            color: var(--text-color); padding: 8px; border-radius: 8px; cursor: pointer;
            font-size: 11px; font-weight: 700; flex: 1; text-align: center; transition: all 0.2s;
        }
        .ui-btn.active { background: var(--neon-cyan); color: #030712; border-color: var(--neon-cyan); box-shadow: 0 0 12px var(--glow-color); }
        .secret-input { background: rgba(0,0,0,0.6); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px; color: #fff; font-size: 12px; width: 100%; box-sizing: border-box; text-align: center; }

        .ticker-wrapper {
            width: 100%; max-width: 500px; background: rgba(255, 0, 127, 0.06);
            border: 1px solid rgba(255, 0, 127, 0.25); border-radius: 8px;
            display: none; align-items: center; overflow: hidden; height: 34px;
            box-shadow: inset 0 0 10px rgba(255, 0, 127, 0.1); margin: 2px 0;
        }
        .ticker-wrapper.active { display: flex; }
        .ticker-badge {
            background: linear-gradient(135deg, #ff0055, var(--neon-pink)); color: white;
            font-size: 10px; font-weight: 900; padding: 0 12px; height: 100%;
            display: flex; align-items: center; white-space: nowrap; letter-spacing: 1px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.3); z-index: 5; text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }
        .ticker-stage { flex: 1; overflow: hidden; position: relative; height: 100%; display: flex; align-items: center; }
        .ticker-text {
            position: absolute; white-space: nowrap; font-size: 12px; font-weight: 700;
            color: #ffffff; letter-spacing: 0.5px; padding-left: 100%;
            animation: tickerMove 18s linear infinite;
        }
        @keyframes tickerMove {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        .search-filter-area { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 500px; }
        .search-box-wrapper { position: relative; width: 100%; }
        .search-box-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--sub-text); font-size: 14px; }
        .search-input {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
            padding: 12px 12px 12px 42px; box-sizing: border-box; border-radius: 30px;
            color: white; font-size: 14px; transition: all 0.3s ease;
        }
        .search-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,204,0.15); outline: none; }
        
        .tag-filter-container { display: flex; justify-content: center; gap: 8px; overflow-x: auto; padding: 4px; width: 100%; }
        .tag-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; color: var(--sub-text);
            padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
            white-space: nowrap; transition: all 0.2s ease;
        }
        .tag-btn.active { background: rgba(0, 255, 204, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); }

        .view-switch-box { display: flex; justify-content: center; margin-top: 5px; gap: 10px; }
        .switch-mode-btn {
            background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: #fff;
            font-size: 12px; font-weight: 800; padding: 8px 16px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 6px; transition: all 0.3s;
        }
        .switch-mode-btn.active { border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,0,127,0.2); }

        .main-container {
            width: 100%; max-width: 1200px; padding: 30px 20px; box-sizing: border-box;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px;
            justify-content: center;
        }
        .main-container.gallery-mode { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; padding: 30px 15px; }

        .member-card {
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 20px; padding: 30px 24px;
            position: relative; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s, box-shadow 0.4s;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .member-card:hover {
            transform: translateY(-10px) scale(1.02); border-color: var(--card-hover-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px var(--glow-color);
        }

        .gallery-mode .member-card { padding: 15px 10px; border-radius: 14px; }
        .gallery-mode .card-tag { display: none; }
        .gallery-mode .member-uid { display: none; }
        .gallery-mode .stats-grid { display: none; }
        .gallery-mode .link-btn { padding: 8px; font-size: 11px; border-radius: 6px; }
        .gallery-mode .avatar-sphere { width: 75px; height: 75px; font-size: 32px; margin-top: 0; }
        .gallery-mode .member-name { font-size: 15px; margin: 10px 0 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .gallery-mode .card-actions { top: 5px; right: 5px; }
        .gallery-mode .action-icon-btn { width: 22px; height: 22px; font-size: 9px; }

        .card-tag {
            position: absolute; top: 15px; left: 20px; font-size: 10px; font-weight: 800;
            background: rgba(0, 119, 255, 0.15); color: var(--neon-blue); border: 1px solid rgba(0, 119, 255, 0.3);
            padding: 3px 10px; border-radius: 10px; letter-spacing: 0.5px; text-transform: uppercase;
        }
        .card-actions { position: absolute; top: 12px; right: 15px; display: none; gap: 6px; z-index: 10; }
        .action-icon-btn {
            background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); width: 28px; height: 28px;
            border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px;
            cursor: pointer; transition: all 0.2s;
        }
        .action-icon-btn.edit { color: var(--neon-cyan); }
        .action-icon-btn.edit:hover { background: var(--neon-cyan); color: #000; }
        .action-icon-btn.del { color: var(--neon-pink); }
        .action-icon-btn.del:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 10px var(--neon-pink); }

        .avatar-sphere {
            width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--neon-cyan);
            background: #030712; display: flex; align-items: center; justify-content: center;
            font-size: 40px; box-shadow: 0 0 15px var(--glow-color); margin-top: 10px;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: transform 0.3s ease;
        }
        .member-card:hover .avatar-sphere { transform: scale(1.05) rotate(5deg); }

        .member-name { font-size: 22px; font-weight: 800; margin: 15px 0 0 0; letter-spacing: 0.5px; text-align: center; }
        .member-uid { font-size: 12px; color: var(--sub-text); margin: 4px 0 15px 0; font-family: monospace; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0, 0, 0, 0.25);
            width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 20px; padding: 10px 0; position: relative;
        }
        .stat-box { text-align: center; position: relative; }
        .stat-box:not(:last-child)::after {
            content: ''; position: absolute; right: 0; top: 15%; height: 70%; width: 1px; background: rgba(255,255,255,0.08);
        }
        .stat-num { font-size: 15px; font-weight: 800; color: var(--neon-cyan); text-shadow: 0 0 8px var(--glow-color); }
        .stat-lbl { font-size: 9px; color: var(--sub-text); font-weight: bold; margin-top: 3px; letter-spacing: 0.5px; }

        .link-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue)); color: #030712;
            text-decoration: none; font-weight: 800; font-size: 13px; padding: 12px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.15); box-sizing: border-box; transition: all 0.3s ease;
        }
        .link-btn:hover { box-shadow: 0 0 25px var(--neon-cyan); transform: scale(1.02); }

        /* ==========================================
           💬 HUB CHAT (一言掲示板) ★オンラインリスト追加
           ========================================== */
        .bbs-container {
            width: 95%; max-width: 950px; margin: 50px auto 20px auto;
            background: linear-gradient(135deg, rgba(10, 20, 42, 0.85) 0%, rgba(5, 10, 25, 0.95) 100%);
            border: 2px solid transparent;
            background-clip: padding-box;
            border-image: linear-gradient(to bottom right, var(--neon-cyan), var(--neon-pink)) 1;
            border-radius: 1px; padding: 24px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            position: relative; overflow: hidden; box-sizing: border-box;
        }
        .bbs-header-zone { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .bbs-title { margin: 0; font-size: 18px; font-weight: 900; letter-spacing: 2.5px; color: #ffffff; display: flex; align-items: center; gap: 10px; }
        .bbs-title i { color: var(--neon-cyan); }
        
        .online-counter {
            background: rgba(0, 255, 204, 0.07); border: 1px solid rgba(0, 255, 204, 0.3);
            padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 900;
            color: var(--neon-cyan); display: flex; align-items: center; gap: 6px;
        }
        .online-dot { width: 7px; height: 7px; background-color: var(--neon-cyan); border-radius: 50%; box-shadow: 0 0 8px var(--neon-cyan); }

        /* 🟢 オンラインID表示ゾーン */
        .online-members-list {
            background: rgba(0,0,0,0.4); border: 1px solid rgba(0, 255, 204, 0.15);
            border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #94a3b8;
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .online-id-badge {
            background: rgba(0, 255, 204, 0.12); border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan); padding: 2px 8px; border-radius: 4px; font-family: monospace; font-weight: bold;
        }

        .bbs-board {
            height: 450px; overflow-y: auto; background: rgba(2, 5, 12, 0.8);
            border-radius: 12px; padding: 20px; box-sizing: border-box;
            display: flex; flex-direction: column; gap: 16px; border: 1px solid rgba(0, 255, 204, 0.1);
        }

        .bbs-row {
            font-size: 13px; line-height: 1.6; padding: 12px 16px; border-radius: 10px;
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.01) 100%);
            display: flex; justify-content: space-between; align-items: flex-start;
            border-left: 4px solid var(--neon-blue); border-bottom: 1px solid rgba(255,255,255,0.03);
            opacity: 0; transform: translateY(12px) scale(0.98);
            animation: chatSlideIn 0.45s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes chatSlideIn { to { opacity: 1; transform: translateY(0) scale(1); filter: brightness(1.2); } }
        
        .bbs-row.admin-msg-row { border-left-color: var(--neon-pink); background: linear-gradient(90deg, rgba(255, 0, 127, 0.05) 0%, transparent 100%); }
        .bbs-content-block { flex: 1; min-width: 0; }
        .bbs-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .bbs-author { color: var(--neon-cyan); font-weight: 800; font-size: 14px; }
        .bbs-user-id-tag { color: var(--sub-text); font-family: monospace; font-size: 11px; font-weight: bold; }
        .admin-msg-row .bbs-author { color: #ff55a5; }
        .bbs-admin-badge { background: linear-gradient(90deg, #ff0055, var(--neon-pink)); color: white; font-size: 9px; font-weight: 900; padding: 1px 6px; border-radius: 4px; }
        .bbs-time { color: var(--sub-text); font-size: 10px; }
        .bbs-text { color: #e2e8f0; word-break: break-all; font-weight: 500; font-size: 14px; }
        .chat-media-preview { margin-top: 10px; max-width: 100%; max-height: 250px; border-radius: 8px; border: 1px solid var(--card-border); display: block; }

        .bbs-del-btn { background: none; border: none; color: #475569; cursor: pointer; padding: 4px 8px; font-size: 14px; display: none; }
        .bbs-del-btn:hover { color: var(--neon-pink); transform: scale(1.2); }
        
        /* 🚨 スマホフォーム配置 */
        .bbs-form {
            display: flex; flex-direction: column; gap: 12px; margin-top: 20px; width: 100%; box-sizing: border-box;
        }
        .bbs-input-top-line {
            display: flex; gap: 10px; width: 100%; box-sizing: border-box; align-items: center;
        }
        .name-and-lock-zone {
            display: flex; align-items: center; gap: 6px; width: 160px; flex-shrink: 0;
        }
        .bbs-input-name {
            width: 100%; background: rgba(0,0,0,0.7); border: 2px solid var(--card-border);
            border-radius: 10px; padding: 12px; color: #fff; font-size: 14px; box-sizing: border-box;
            font-weight: bold; text-align: center; height: 48px;
        }
        .bbs-input-name:disabled { background: rgba(15, 23, 42, 0.6); border-color: var(--neon-cyan); color: var(--neon-cyan); }
        
        .name-lock-btn {
            background: rgba(0,0,0,0.5); border: 2px solid var(--card-border); color: var(--sub-text);
            cursor: pointer; font-size: 14px; width: 44px; height: 48px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .name-lock-btn.locked { color: var(--neon-cyan); border-color: var(--neon-cyan); }

        .bbs-media-attach-btn {
            background: rgba(0,0,0,0.5); border: 2px solid var(--card-border); color: var(--neon-cyan);
            cursor: pointer; font-size: 18px; width: 54px; height: 48px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .bbs-media-attach-btn.attached { color: #000; background: var(--neon-cyan); border-color: var(--neon-cyan); }

        /* 自分のIDを表示するバッジ */
        .my-id-display-tag {
            font-size: 11px; font-family: monospace; background: rgba(255,255,255,0.05);
            border: 1px solid var(--card-border); border-radius: 8px; padding: 0 10px;
            height: 48px; display: flex; align-items: center; color: var(--sub-text); white-space: nowrap;
        }

        .bbs-input-main-line {
            display: flex; gap: 10px; width: 100%; box-sizing: border-box;
        }
        .bbs-input-text {
            flex: 1; min-width: 0; background: rgba(0,0,0,0.7); border: 2px solid var(--card-border);
            border-radius: 10px; padding: 14px; color: #fff; font-size: 15px; box-sizing: border-box;
            height: 54px;
        }
        .bbs-input-text:focus { border-color: var(--neon-pink); outline: none; }
        
        .bbs-send-btn {
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-blue) 100%); color: #030712;
            border: none; font-weight: 900; padding: 14px; border-radius: 10px; cursor: pointer;
            font-size: 15px; letter-spacing: 2px; width: 100%; box-sizing: border-box; height: 52px;
        }
        .bbs-send-btn:hover { background: #fff; box-shadow: 0 0 15px var(--neon-cyan); }

        /* ==========================================
           🔔 REALTIME NOTIFICATION TOAST
           ========================================== */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .cyber-toast {
            background: rgba(6, 11, 25, 0.95); border: 1px solid var(--neon-cyan);
            border-left: 4px solid var(--neon-cyan); padding: 12px 20px; border-radius: 8px;
            color: white; pointer-events: auto; min-width: 240px; max-width: 320px;
            display: flex; flex-direction: column; gap: 4px; transform: translateX(120%); opacity: 0;
            animation: toastIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, toastOut 0.4s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards 4s;
        }
        @keyframes toastIn { to { transform: translateX(0); opacity: 1; } }
        @keyframes toastOut { to { transform: translateX(150%); opacity: 0; } }
        .toast-head { font-weight: 900; font-size: 11px; color: var(--neon-cyan); }
        .toast-body { font-size: 12px; color: #e2e8f0; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .add-float-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-pink), #ff0055); border: 2px solid #ffffff;
            color: white; font-size: 26px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 127, 0.5); z-index: 999;
            opacity: 0; transform: scale(0) rotate(-90deg); pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .add-float-btn.visible { opacity: 1; transform: scale(1) rotate(0deg); pointer-events: auto; }

        .modal-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 100000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-mask.active { opacity: 1; pointer-events: auto; }
        .modal-window {
            background: var(--panel-bg); border: 1px solid var(--neon-cyan); border-radius: 20px;
            padding: 30px; width: 92%; max-width: 440px; box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            box-sizing: border-box; max-height: 85vh; overflow-y: auto;
            transform: translateY(30px) scale(0.95); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-mask.active .modal-window { transform: translateY(0) scale(1); }
        .modal-window h2 { margin: 0 0 25px 0; font-size: 20px; color: var(--neon-cyan); text-align: center; font-weight: 800; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; position: relative; }
        .input-group label { font-size: 11px; color: var(--sub-text); font-weight: 800; display: flex; justify-content: space-between; }
        
        .input-wrapper { position: relative; width: 100%; }
        .input-group input, .input-group select {
            width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
            border-radius: 8px; padding: 11px 32px 11px 14px; color: white; font-size: 13px;
            box-sizing: border-box;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--neon-cyan); outline: none; }
        
        .custom-file-upload {
            display: block; width: 100%; background: rgba(255,255,255,0.02); border: 1px dashed var(--neon-cyan);
            border-radius: 8px; padding: 8px; text-align: center; color: var(--neon-cyan); font-size: 11px;
            font-weight: 800; cursor: pointer; margin-top: 4px; box-sizing: border-box;
        }
        .clear-field-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--neon-pink); cursor: pointer;
            font-size: 14px; padding: 2px; display: none; z-index: 5;
        }
        
        .actions-row { display: flex; gap: 12px; margin-top: 25px; }
        .form-btn { flex: 1; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; border: none; }
        .form-btn.back { background: #1e293b; color: #94a3b8; }
        .form-btn.go { background: var(--neon-cyan); color: #030712; }

        .confirm-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center; z-index: 200000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .confirm-mask.active { opacity: 1; pointer-events: auto; }
        .confirm-window {
            background: #090d16; border: 2px solid var(--neon-pink); border-radius: 16px;
            padding: 24px; width: 90%; max-width: 360px; text-align: center; box-sizing: border-box;
            transform: scale(0.9) translateY(20px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .confirm-mask.active .confirm-window { transform: scale(1) translateY(0); }
        .confirm-icon { font-size: 42px; color: var(--neon-pink); margin-bottom: 15px; }
        .confirm-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .confirm-msg { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
        .confirm-actions { display: flex; gap: 10px; }
        .confirm-btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; border: none; }
        .confirm-btn.no { background: #1e293b; color: #fff; }
        .confirm-btn.yes { background: linear-gradient(90deg, #ff0055, var(--neon-pink)); color: #fff; }

        @keyframes cardEntrance { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--sub-text); font-size: 14px; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="header-wrapper">
        <div class="header-main">
            <h1>⚽ FOOTBALL COMMUNITY JP</h1>
            <button class="settings-btn" onclick="togglePanel(event)"><i class="fa-solid fa-sliders"></i></button>
        </div>

        <div class="control-panel" id="controlPanel">
            <div class="panel-sec">
                <h4><i class="fa-solid fa-lock"></i> Admin Authentication</h4>
                <input type="password" id="adminPass" class="secret-input" placeholder="コードを入力..." oninput="verifyAdmin()">
            </div>
            <div class="panel-sec" id="adminNewsSec" style="display:none;">
                <h4><i class="fa-solid fa-bullhorn"></i> Live News Option</h4>
                <input type="text" id="adminNewsInput" class="secret-input" placeholder="速報テキストを入力..." maxlength="100">
                <div style="display:flex; gap:6px; margin-top:6px;">
                    <button class="ui-btn" style="background:var(--neon-cyan); color:#030712; border-color:var(--neon-cyan);" onclick="askPublishNews()">配信する</button>
                    <button class="ui-btn" style="background:#ff0055; color:#fff; border-color:#ff0055;" onclick="askClearNews()">速報を消去</button>
                </div>
            </div>
            <div class="panel-sec">
                <h4><i class="fa-solid fa-arrow-down-wide-short"></i> Dynamic Sort</h4>
                <div class="ui-group">
                    <button class="ui-btn active" id="sort-idx" onclick="updateSort('default', this)">標準</button>
                    <button class="ui-btn" id="sort-fol" onclick="updateSort('followers', this)">人気</button>
                    <button class="ui-btn" id="sort-lk" onclick="updateSort('likes', this)">いいね</button>
                </div>
            </div>
            <div class="panel-sec">
                <h4><i class="fa-solid fa-palette"></i> Cyber Grid Theme</h4>
                <div class="ui-group" style="flex-wrap: wrap;">
                    <button class="ui-btn active" onclick="updateTheme('cyber', this)">NEON</button>
                    <button class="ui-btn" onclick="updateTheme('galaxy', this)">SPACE</button>
                    <button class="ui-btn" onclick="updateTheme('dark', this)">DARK</button>
                    <button class="ui-btn" onclick="updateTheme('light', this)">LIGHT</button>
                </div>
            </div>
        </div>

        <div class="ticker-wrapper" id="liveTickerWrapper">
            <div class="ticker-badge"><i class="fa-solid fa-bolt"></i> ニュース速報</div>
            <div class="ticker-stage">
                <div class="ticker-text" id="liveTickerText"></div>
            </div>
        </div>

        <div class="search-filter-area">
            <div class="search-box-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchBar" class="search-input" placeholder="メンバー名やIDで瞬時に検索..." oninput="filterMembers()">
            </div>
            <div class="tag-filter-container">
                <button class="tag-btn active" onclick="filterTag('all', this)">ALL</button>
                <button class="tag-btn" onclick="filterTag('editor', this)">EDITOR</button>
                <button class="tag-btn" onclick="filterTag('player', this)">PLAYER</button>
                <button class="tag-btn" onclick="filterTag('other', this)">OTHER</button>
            </div>
            
            <div class="view-switch-box">
                <button class="switch-mode-btn active" id="modeCardBtn" onclick="toggleViewMode('card')">
                    <i class="fa-solid fa-table-cells-large"></i> カード表示
                </button>
                <button class="switch-mode-btn" id="modeGalleryBtn" onclick="toggleViewMode('gallery')">
                    <i class="fa-solid fa-images"></i> ギャラリー
                </button>
            </div>
        </div>
    </div>

    <div class="main-container" id="cardsGrid"></div>
    
    <div class="bbs-container">
        <div class="bbs-header-zone">
            <div class="bbs-title"><i class="fa-solid fa-comments"></i> HUB CHAT (一言掲示板)</div>
            <div class="online-counter" id="onlineCounterView">
                <div class="online-dot"></div><span id="onlineCountNumber">1</span> 人がオンライン
            </div>
        </div>

        <div class="online-members-list" id="onlineMembersList">
            <span>🟢 現在潜入中:</span>
            <div id="onlineBadgesStage" style="display:flex; gap:6px; flex-wrap:wrap;"></div>
        </div>
        
        <div class="bbs-board" id="bbsBoard">
            <div class="empty-state" style="padding:20px 0;">メッセージを読み込み中...</div>
        </div>

        <div class="bbs-form">
            <div class="bbs-input-top-line">
                <div class="name-and-lock-zone">
                    <input type="text" id="bbsName" class="bbs-input-name" placeholder="名前" value="名無し" onchange="saveNameToStorage()">
                    <button class="name-lock-btn" id="nameLockBtn" onclick="toggleNameLock()" title="名前を固定する"><i class="fa-solid fa-lock-open"></i></button>
                </div>
                
                <button class="bbs-media-attach-btn" id="bbsMediaBtn" onclick="document.getElementById('bbsFilePicker').click()" title="写真または動画を選択"><i class="fa-solid fa-camera"></i></button>
                <input type="file" id="bbsFilePicker" accept="image/*,video/*" style="display:none;" onchange="handleChatMediaSelect(this)">
                <input type="hidden" id="bbsMediaDataHolder">
                <input type="hidden" id="bbsMediaTypeHolder">

                <div class="my-id-display-tag" id="myIdDisplayTag">ID: ----</div>
            </div>
            
            <div class="bbs-input-main-line">
                <input type="text" id="bbsText" class="bbs-input-text" placeholder="メッセージを入力（ファイルのみでも送信OK）" onkeydown="if(event.key==='Enter') sendBbsMessage()">
            </div>
            
            <button class="bbs-send-btn" onclick="sendBbsMessage()">送信する</button>
        </div>
    </div>
    
    <button class="add-float-btn" id="addFloatBtn" onclick="launchModal(event)"><i class="fa-solid fa-plus"></i></button>

    <div class="modal-mask" id="memberModal" onclick="dismissModal()">
        <div class="modal-window" onclick="event.stopPropagation()">
            <h2 id="modalTitle">NEW MEMBER CREATOR</h2>
            <input type="hidden" id="editTargetId">
            <input type="hidden" id="base64AvatarHolder">
            
            <div class="form-row">
                <div class="input-group">
                    <label>アバター (絵文字 / URL)</label>
                    <div class="input-wrapper">
                        <input type="text" id="formAvatar" value="⚽" oninput="toggleClearBtn(this)">
                        <button class="clear-field-btn" onclick="clearInput('formAvatar')"><i class="fa-solid fa-circle-xmark"></i></button>
                    </div>
                    <label class="custom-file-upload">
                        <i class="fa-solid fa-images"></i> 写真アルバムから選択
                        <input type="file" id="filePicker" accept="image/*" style="display:none;" onchange="processImageUpload(this)">
                    </label>
                </div>
                <div class="input-group">
                    <label>役割区分 (TAG)</label>
                    <select id="formTag">
                        <option value="editor">EDITOR</option>
                        <option value="player">PLAYER</option>
                        <option value="other">OTHER</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>名前 <span id="nameCount" style="color:var(--neon-cyan);">0文字</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="formName" placeholder="ネイマール" oninput="handleNameInput(this)">
                        <button class="clear-field-btn" onclick="clearInput('formName')"><i class="fa-solid fa-circle-xmark"></i></button>
                    </div>
                </div>
                <div class="input-group">
                    <label>ユーザー名 (ID)</label>
                    <div class="input-wrapper">
                        <input type="text" id="formUser" placeholder="@neymarjr" oninput="toggleClearBtn(this)">
                        <button class="clear-field-btn" onclick="clearInput('formUser')"><i class="fa-solid fa-circle-xmark"></i></button>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>フォロワー数 (半角数字)</label>
                    <input type="number" id="formFollowers" value="0">
                </div>
                <div class="input-group">
                    <label>フォロワー表示 (例: 50K)</label>
                    <input type="text" id="formFollowersTxt" value="0">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>いいね数 (半角数字)</label>
                    <input type="number" id="formLikes" value="0">
                </div>
                <div class="input-group">
                    <label>いいね表示 (例: 1.2M)</label>
                    <input type="text" id="formLikesTxt" value="0">
                </div>
            </div>

            <div class="input-group">
                <label>フォロー中カウント</label>
                <div class="input-wrapper">
                    <input type="text" id="formFollowing" value="0" oninput="toggleClearBtn(this)">
                    <button class="clear-field-btn" onclick="clearInput('formFollowing')"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
            </div>

            <div class="input-group">
                <label>TikTok プロフィールリンク</label>
                <div class="input-wrapper">
                    <input type="text" id="formUrl" value="https://www.tiktok.com/" oninput="toggleClearBtn(this)">
                    <button class="clear-field-btn" onclick="clearInput('formUrl')"><i class="fa-solid fa-circle-xmark"></i></button>
                </div>
            </div>

            <div class="actions-row">
                <button class="form-btn back" onclick="dismissModal()">CANCEL</button>
                <button class="form-btn go" onclick="commitMemberData()">SAVE DATA</button>
            </div>
        </div>
    </div>

    <div class="confirm-mask" id="cyberConfirm">
        <div class="confirm-window">
            <div class="confirm-icon" id="confirmIcon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="confirm-title" id="confirmTitle">WARNING SYSTEM</div>
            <div class="confirm-msg" id="confirmMsg">本当に処理を実行するんだな？</div>
            <div class="confirm-actions">
                <button class="confirm-btn no" id="confirmNoBtn" onclick="closeCyberConfirm(false)">CANCEL</button>
                <button class="confirm-btn yes" id="confirmYesBtn" onclick="closeCyberConfirm(true)">DELETE</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://footballcommunityjp-default-rtdb.asia-southeast1.firebasedatabase.app/", 
            projectId: "footballcommunityjp"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const MASTER_CODE = "ここに新しい秘密のコード";

        let localRawData = [];
        let activeSort = 'default';
        let activeTag = 'all';
        let currentViewMode = 'card';
        let isAdminLoggedIn = false;
        let isInitialLoadFinished = false; 
        
        let confirmContext = "delete_card";
        let pendingDeleteId = null;
        let pendingDeleteChatKey = null;

        // 🆔 【永久保存IDの生成・読み込みシステム】
        let myPermanentId = localStorage.getItem('fc_permanent_user_id');
        if (!myPermanentId) {
            myPermanentId = 'ID-' + Math.floor(1000 + Math.random() * 9000); // 4桁のランダム数字ID
            localStorage.setItem('fc_permanent_user_id', myPermanentId);
        }
        document.getElementById('myIdDisplayTag').innerText = "#" + myPermanentId;

        database.ref('members').on('value', (snapshot) => {
            const val = snapshot.val();
            localRawData = val ? Object.values(val) : [];
            processAndRender();
        });

        database.ref('live_news_flash').on('value', (snapshot) => {
            const currentNews = snapshot.val();
            const tickerWrapper = document.getElementById('liveTickerWrapper');
            const tickerTextEl = document.getElementById('liveTickerText');
            
            if (currentNews && currentNews.text && currentNews.text.trim() !== "") {
                tickerTextEl.innerText = currentNews.text;
                tickerWrapper.classList.add('active'); 
                tickerTextEl.style.animation = 'none';
                tickerTextEl.offsetHeight; 
                tickerTextEl.style.animation = 'tickerMove 20s linear infinite';
            } else {
                tickerTextEl.innerText = "";
                tickerWrapper.classList.remove('active'); 
            }
        });

        function askPublishNews() {
            const newsInput = document.getElementById('adminNewsInput');
            const newText = newsInput.value.trim();
            if(!newText) return;

            confirmContext = "publish_news";
            document.getElementById('confirmIcon').innerHTML = `<i class="fa-solid fa-paper-plane" style="color:var(--neon-cyan);"></i>`;
            document.getElementById('confirmTitle').innerText = "LIVE NEWS TRANSMIT";
            document.getElementById('confirmMsg').innerHTML = `以下のニュース速報を全員の画面へ配信するぞ。<br><br><span style="color:#fff; font-weight:bold;">「【速報】${newText}」</span>`;
            document.getElementById('confirmYesBtn').innerText = "配信開始";
            document.getElementById('confirmYesBtn').style.background = "var(--neon-cyan)";
            document.getElementById('confirmYesBtn').style.color = "#030712";
            document.getElementById('cyberConfirm').classList.add('active');
        }

        function askClearNews() {
            confirmContext = "clear_news";
            document.getElementById('confirmIcon').innerHTML = `<i class="fa-solid fa-trash-can" style="color:#ff0055;"></i>`;
            document.getElementById('confirmTitle').innerText = "CLEAR LIVE NEWS";
            document.getElementById('confirmMsg').innerHTML = "配信中のニュース速報を消去するぞ。";
            document.getElementById('confirmYesBtn').innerText = "速報を消去";
            document.getElementById('confirmYesBtn').style.background = "#ff0055";
            document.getElementById('confirmYesBtn').style.color = "#fff";
            document.getElementById('cyberConfirm').classList.add('active');
        }

        // 👥 【進化版】オンラインメンバーIDリアルタイム同期
        const myPresenceRef = database.ref('online_users/' + myPermanentId);
        const connectedRef = database.ref('.info/connected');
        
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                myPresenceRef.onDisconnect().remove();
                myPresenceRef.set({ timestamp: Date.now() });
            }
        });
        
        database.ref('online_users').on('value', (snap) => {
            const count = snap.numChildren() || 1;
            document.getElementById('onlineCountNumber').innerText = count;

            const stage = document.getElementById('onlineBadgesStage');
            stage.innerHTML = '';
            if (snap.exists()) {
                snap.forEach((child) => {
                    const onlineId = child.key;
                    const badge = document.createElement('span');
                    badge.className = 'online-id-badge';
                    badge.innerText = '#' + onlineId;
                    stage.appendChild(badge);
                });
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('fc_bbs_username');
            const isLocked = localStorage.getItem('fc_bbs_namelocked');
            const nameInput = document.getElementById('bbsName');
            const lockBtn = document.getElementById('nameLockBtn');
            
            if (savedName) nameInput.value = savedName;
            
            if (isLocked === 'true') {
                nameInput.disabled = true;
                lockBtn.innerHTML = `<i class="fa-solid fa-lock"></i>`;
                lockBtn.classList.add('locked');
            } else {
                nameInput.disabled = false;
                lockBtn.innerHTML = `<i class="fa-solid fa-lock-open"></i>`;
                lockBtn.classList.remove('locked');
            }
        });

        function toggleNameLock() {
            const nameInput = document.getElementById('bbsName');
            const lockBtn = document.getElementById('nameLockBtn');
            
            if (nameInput.disabled) {
                if (isAdminLoggedIn) {
                    nameInput.disabled = false;
                    lockBtn.innerHTML = `<i class="fa-solid fa-lock-open"></i>`;
                    lockBtn.classList.remove('locked');
                    localStorage.setItem('fc_bbs_namelocked', 'false');
                    nameInput.focus();
                    return;
                }

                const pass = prompt("名前の固定を解除するためのパスコードを入力してくれ：");
                const savedUnlockKey = localStorage.getItem('fc_bbs_unlockkey');

                if (pass === MASTER_CODE || (savedUnlockKey && pass === savedUnlockKey)) {
                    nameInput.disabled = false;
                    lockBtn.innerHTML = `<i class="fa-solid fa-lock-open"></i>`;
                    lockBtn.classList.remove('locked');
                    localStorage.setItem('fc_bbs_namelocked', 'false');
                    nameInput.focus();
                } else {
                    alert("コードが違うぜ！名前は固定されたまだ。");
                }
            } else {
                const finalName = nameInput.value.trim() || '名無し';
                const userKey = prompt("ロック解除用の【パスワード】を決めて入力してくれ：");
                
                if (!userKey || userKey.trim() === "") {
                    alert("パスワードが空っぽだからロックを中止したぜ！");
                    return;
                }

                nameInput.value = finalName;
                localStorage.setItem('fc_bbs_username', finalName);
                localStorage.setItem('fc_bbs_unlockkey', userKey.trim()); 
                localStorage.setItem('fc_bbs_namelocked', 'true');
                
                nameInput.disabled = true;
                lockBtn.innerHTML = `<i class="fa-solid fa-lock"></i>`;
                lockBtn.classList.add('locked');
                alert("名前をガチ固定したぜ！");
            }
        }

        function saveNameToStorage() {
            const nameInput = document.getElementById('bbsName');
            const finalName = nameInput.value.trim() || '名無し';
            localStorage.setItem('fc_bbs_username', finalName);
        }

        function spawnNotification(author, text) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'cyber-toast';
            toast.innerHTML = `
                <div class="toast-head"><i class="fa-solid fa-bell"></i> NEW CHAT RECEIVED!</div>
                <div class="toast-body"><strong>${author}:</strong> ${text}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4500);
        }

        function handleChatMediaSelect(input) {
            const file = input.files[0];
            const btn = document.getElementById('bbsMediaBtn');
            if (!file) return;

            if (file.size > 10 * 1024 * 1024) {
                alert("ファイルが大きすぎるぜ！10MB以下の写真か動画にしてくれ。");
                input.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('bbsMediaDataHolder').value = e.target.result;
                document.getElementById('bbsMediaTypeHolder').value = file.type.startsWith('video') ? 'video' : 'image';
                btn.classList.add('attached');
                btn.innerHTML = `<i class="fa-solid fa-circle-check"></i>`;
            };
            reader.readAsDataURL(file);
        }

        database.ref('bbs_messages').orderByChild('timestamp').limitToLast(40).on('value', (snapshot) => {
            const board = document.getElementById('bbsBoard');
            board.innerHTML = '';
            
            if (!snapshot.exists()) {
                board.innerHTML = '<div class="empty-state" style="padding:20px 0;">まだ誰も書き込んでないぜ！</div>';
                isInitialLoadFinished = true; 
                return;
            }

            let lastAuthor = ""; let lastText = "";

            snapshot.forEach((childSnapshot) => {
                const key = childSnapshot.key;
                const msg = childSnapshot.val();
                const cleanName = escapeHtml(msg.name || '名無し');
                const cleanText = escapeHtml(msg.text || '');
                const displayUserId = msg.userId ? escapeHtml(msg.userId) : '????';
                const timeStr = msg.time || '';
                
                lastAuthor = cleanName; lastText = cleanText ? cleanText : "📂 メディアファイルを送信";
                const isAdmin = msg.isAdminMessage;
                const adminBadge = isAdmin ? `<span class="bbs-admin-badge"><i class="fa-solid fa-crown"></i> ADMIN</span>` : '';
                const rowClass = isAdmin ? 'bbs-row admin-msg-row' : 'bbs-row';

                let mediaHtml = '';
                if (msg.mediaData) {
                    if (msg.mediaType === 'video') {
                        mediaHtml = `<video src="${msg.mediaData}" class="chat-media-preview" controls></video>`;
                    } else {
                        mediaHtml = `<img src="${msg.mediaData}" class="chat-media-preview" alt="chat-pic">`;
                    }
                }

                const rowHtml = `
                    <div class="${rowClass}" id="chat_${key}">
                        <div class="bbs-content-block">
                            <div class="bbs-meta">
                                <span class="bbs-author">${cleanName}</span>
                                <span class="bbs-user-id-tag">#${displayUserId}</span>
                                ${adminBadge}
                                <span class="bbs-time">${timeStr}</span>
                            </div>
                            <div class="bbs-text">${cleanText}</div>
                            ${mediaHtml}
                        </div>
                        <button class="bbs-del-btn" data-chat-key="${key}" onclick="askDeleteChat('${key}', event)"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `;
                board.insertAdjacentHTML('beforeend', rowHtml);
            });
            
            board.scrollTop = board.scrollHeight;
            refreshChatAdminUI();
            if (isInitialLoadFinished) spawnNotification(lastAuthor, lastText);
            isInitialLoadFinished = true; 
        });

        function escapeHtml(str) { return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function sendBbsMessage() {
            const nameInput = document.getElementById('bbsName');
            const textInput = document.getElementById('bbsText');
            const name = nameInput.value.trim() || '名無し';
            const text = textInput.value.trim();

            const mediaData = document.getElementById('bbsMediaDataHolder').value;
            const mediaType = document.getElementById('bbsMediaTypeHolder').value;

            if (!text && !mediaData) return;

            if (!nameInput.disabled) {
                nameInput.value = name;
                localStorage.setItem('fc_bbs_username', name);
                localStorage.setItem('fc_bbs_unlockkey', "1234"); 
                localStorage.setItem('fc_bbs_namelocked', 'true');
                nameInput.disabled = true;
                const lockBtn = document.getElementById('nameLockBtn');
                lockBtn.innerHTML = `<i class="fa-solid fa-lock"></i>`;
                lockBtn.classList.add('locked');
            }

            const now = new Date();
            const timeStr = `${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

            const msgPack = { 
                name: name, 
                text: text, 
                time: timeStr, 
                timestamp: Date.now(),
                userId: myPermanentId, // 🆔 メッセージに永久IDを紐付け！
                isAdminMessage: isAdminLoggedIn
            };

            if (mediaData) {
                msgPack.mediaData = mediaData;
                msgPack.mediaType = mediaType;
            }

            database.ref('bbs_messages').push(msgPack)
            .then(() => { 
                textInput.value = ''; 
                document.getElementById('bbsMediaDataHolder').value = '';
                document.getElementById('bbsMediaTypeHolder').value = '';
                document.getElementById('bbsFilePicker').value = '';
                const btn = document.getElementById('bbsMediaBtn');
                btn.classList.remove('attached');
                btn.innerHTML = `<i class="fa-solid fa-camera"></i>`;
            })
            .catch(err => alert("送信失敗: " + err.message));
        }

        function askDeleteChat(key, event) {
            if(event) event.stopPropagation();
            confirmContext = "delete_chat";
            pendingDeleteChatKey = key;
            document.getElementById('confirmIcon').innerHTML = `<i class="fa-solid fa-comment-slash" style="color:#ff0055;"></i>`;
            document.getElementById('confirmTitle').innerText = "DELETE CHAT MESSAGE";
            document.getElementById('confirmMsg').innerHTML = "このチャットメッセージを削除するんだな？";
            document.getElementById('confirmYesBtn').innerText = "メッセージ削除";
            document.getElementById('confirmYesBtn').style.background = "#ff0055";
            document.getElementById('confirmYesBtn').style.color = "#fff";
            document.getElementById('cyberConfirm').classList.add('active');
        }

        function toggleViewMode(mode) {
            currentViewMode = mode;
            const grid = document.getElementById('cardsGrid');
            const cardBtn = document.getElementById('modeCardBtn');
            const galleryBtn = document.getElementById('modeGalleryBtn');
            if (mode === 'gallery') {
                grid.classList.add('gallery-mode'); galleryBtn.classList.add('active'); cardBtn.classList.remove('active');
            } else {
                grid.classList.remove('gallery-mode'); cardBtn.classList.add('active'); galleryBtn.classList.remove('active');
            }
            processAndRender();
        }

        function togglePanel(event) {
            if (event) event.stopPropagation();
            document.getElementById('controlPanel').classList.toggle('open');
        }

        window.addEventListener('click', (e) => {
            const panel = document.getElementById('controlPanel');
            const toggleBtn = document.querySelector('.settings-btn');
            if (panel && !panel.contains(e.target) && !toggleBtn.contains(e.target)) {
                panel.classList.remove('open');
            }
        });

        function verifyAdmin() {
            const input = document.getElementById('adminPass').value;
            const floatBtn = document.getElementById('addFloatBtn');
            const actionAreas = document.querySelectorAll('.card-actions');
            const adminNewsSec = document.getElementById('adminNewsSec');

            if (input === MASTER_CODE) {
                isAdminLoggedIn = true;
                floatBtn.classList.add('visible');
                actionAreas.forEach(a => a.style.display = 'flex');
                if(adminNewsSec) adminNewsSec.style.display = 'block'; 
            } else {
                isAdminLoggedIn = false;
                floatBtn.classList.remove('visible');
                actionAreas.forEach(a => a.style.display = 'none');
                if(adminNewsSec) adminNewsSec.style.display = 'none';
            }
            refreshChatAdminUI();
        }

        function refreshChatAdminUI() {
            const delButtons = document.querySelectorAll('.bbs-del-btn');
            delButtons.forEach(btn => { btn.style.display = isAdminLoggedIn ? 'block' : 'none'; });
        }

        function processImageUpload(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('base64AvatarHolder').value = e.target.result;
                    const avatarInput = document.getElementById('formAvatar');
                    avatarInput.value = "[カスタム選手画像を選択中]";
                    toggleClearBtn(avatarInput);
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function clearInput(targetId) {
            const el = document.getElementById(targetId); el.value = '';
            if (targetId === 'formName') document.getElementById('nameCount').innerText = '0文字';
            if (targetId === 'formAvatar') document.getElementById('base64AvatarHolder').value = '';
            toggleClearBtn(el); el.focus();
        }

        function toggleClearBtn(el) {
            const btn = el.parentElement.querySelector('.clear-field-btn');
            if (btn) btn.style.display = el.value.length > 0 ? 'block' : 'none';
        }

        function handleNameInput(el) {
            toggleClearBtn(el);
            document.getElementById('nameCount').innerText = `${el.value.length}文字`;
            const userEl = document.getElementById('formUser');
            if (el.value.trim() === '') {
                userEl.value = '';
            } else if (userEl.value === '' || userEl.value.startsWith('@nitbs_')) {
                userEl.value = '@nitbs_' + Math.floor(Math.random() * 9000 + 1000);
            }
            toggleClearBtn(userEl);
        }

        document.getElementById('memberModal').addEventListener('click', dismissModal);
        function dismissModal() { document.getElementById('memberModal').classList.remove('active'); }

        function commitMemberData() {
            const name = document.getElementById('formName').value.trim();
            if (!name) { alert("名前は必ず入力してくれ！"); return; }
            const existingId = document.getElementById('editTargetId').value;
            const targetId = existingId ? existingId : 'mem_' + Date.now();
            const b64 = document.getElementById('base64AvatarHolder').value;
            let finalAvatar = document.getElementById('formAvatar').value.trim();
            if (b64) finalAvatar = b64;
            const pack = {
                id: targetId, tag: document.getElementById('formTag').value, avatar: finalAvatar, name: name,
                username: document.getElementById('formUser').value.trim() || "@username",
                followers: parseInt(document.getElementById('formFollowers').value) || 0, followersTxt: document.getElementById('formFollowersTxt').value.trim() || "0",
                likes: parseInt(document.getElementById('formLikes').value) || 0, likesTxt: document.getElementById('formLikesTxt').value.trim() || "0",
                following: document.getElementById('formFollowing').value.trim() || "0", tiktokUrl: document.getElementById('formUrl').value.trim() || "https://www.tiktok.com/"
            };
            database.ref('members/' + targetId).set(pack).then(() => dismissModal()).catch(err => alert("エラー: " + err.message));
        }

        function updateTheme(theme, element) {
            if (theme === 'cyber') document.body.removeAttribute('data-theme');
            else document.body.setAttribute('data-theme', theme);
            element.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('controlPanel').classList.remove('open');
        }

        function updateSort(criteria, element) {
            activeSort = criteria; processAndRender();
            element.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('controlPanel').classList.remove('open');
        }

        function filterTag(tag, element) { activeTag = tag; processAndRender(); element.parentElement.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active')); element.classList.add('active'); }
        function filterMembers() { processAndRender(); }

        function processAndRender() {
            let workingList = [...localRawData];
            if (activeTag !== 'all') workingList = workingList.filter(m => m.tag === activeTag);
            const keyword = document.getElementById('searchBar').value.toLowerCase().trim();
            if (keyword) {
                workingList = workingList.filter(m => 
                    (m.name && m.name.toLowerCase().includes(keyword)) || (m.username && m.username.toLowerCase().includes(keyword))
                );
            }
            if (activeSort === 'followers') workingList.sort((a, b) => (b.followers || 0) - (a.followers || 0));
            else if (activeSort === 'likes') workingList.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            else workingList.sort((a, b) => String(a.id).localeCompare(String(b.id)));

            const grid = document.getElementById('cardsGrid'); grid.innerHTML = '';
            if (workingList.length === 0) {
                grid.innerHTML = '<div class="empty-state">該当するメンバーが見つからないぜ</div>';
                return;
            }

            workingList.forEach(m => {
                const isBase64 = m.avatar && m.avatar.startsWith('data:image');
                const isUrl = m.avatar && m.avatar.startsWith('http');
                const avatarStyle = (isBase64 || isUrl) ? `background-image: url('${m.avatar}');` : '';
                const avatarContent = (isBase64 || isUrl) ? '' : (m.avatar || "⚽");

                const cardHtml = `
                    <div class="member-card">
                        <div class="card-tag">${m.tag || 'editor'}</div>
                        <div class="card-actions">
                            <button class="action-icon-btn edit" onclick="initiateEdit('${m.id}', event)"><i class="fa-solid fa-pen"></i></button>
                            <button class="action-icon-btn del" onclick="openCyberConfirm('${m.id}', '${m.name}', event)"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        <div class="avatar-sphere" style="${avatarStyle}">${avatarContent}</div>
                        <div class="member-name">${m.name}</div>
                        <div class="member-uid">${m.username || '@username'}</div>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-num">${m.followersTxt || '0'}</div>
                                <div class="stat-lbl">フォロワー</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-num">${m.likesTxt || '0'}</div>
                                <div class="stat-lbl">いいね</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-num">${m.following || '0'}</div>
                                <div class="stat-lbl">フォロー</div>
                            </div>
                        </div>
                        <a href="${m.tiktokUrl || 'https://www.tiktok.com/'}" target="_blank" class="link-btn" onclick="event.stopPropagation()">
                            <i class="fa-brands fa-tiktok"></i> TikTok Profile
                        </a>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
            verifyAdmin();
        }

        function launchModal(event) {
            if(event) event.stopPropagation();
            document.getElementById('modalTitle').innerText = "NEW MEMBER CREATOR";
            document.getElementById('editTargetId').value = ""; document.getElementById('base64AvatarHolder').value = "";
            document.getElementById('formName').value = ""; document.getElementById('formUser').value = "";
            document.getElementById('formAvatar').value = "⚽"; document.getElementById('formFollowers').value = 0;
            document.getElementById('formFollowersTxt').value = "0"; document.getElementById('formLikes').value = 0;
            document.getElementById('formLikesTxt').value = "0"; document.getElementById('formFollowing').value = "0";
            document.getElementById('formUrl').value = "https://www.tiktok.com/"; document.getElementById('nameCount').innerText = "0文字";
            document.querySelectorAll('.modal-window input').forEach(el => toggleClearBtn(el));
            document.getElementById('memberModal').classList.add('active');
        }

        function initiateEdit(id, event) {
            if(event) event.stopPropagation();
            const target = localRawData.find(m => String(m.id) === String(id));
            if (!target) return;
            document.getElementById('modalTitle').innerText = "MEMBER PROFILE EDITOR";
            document.getElementById('editTargetId').value = target.id;
            document.getElementById('formTag').value = target.tag || "editor";
            if(target.avatar && target.avatar.startsWith('data:image')) {
                document.getElementById('base64AvatarHolder').value = target.avatar; document.getElementById('formAvatar').value = "[カスタム選手画像を選択中]";
            } else {
                document.getElementById('base64AvatarHolder').value = ""; document.getElementById('formAvatar').value = target.avatar || "⚽";
            }
            document.getElementById('formName').value = target.name || ""; document.getElementById('formUser').value = target.username || "";
            document.getElementById('formFollowers').value = target.followers || 0; document.getElementById('formFollowersTxt').value = target.followersTxt || "0";
            document.getElementById('formLikes').value = target.likes || 0; document.getElementById('formLikesTxt').value = target.likesTxt || "0";
            document.getElementById('formFollowing').value = target.following || "0"; document.getElementById('formUrl').value = target.tiktokUrl || "https://www.tiktok.com/";
            document.getElementById('nameCount').innerText = `${(target.name || "").length}文字`;
            document.querySelectorAll('.modal-window input').forEach(el => toggleClearBtn(el));
            document.getElementById('memberModal').classList.add('active');
        }

        function openCyberConfirm(id, name, event) {
            if(event) event.stopPropagation();
            confirmContext = "delete_card"; pendingDeleteId = id;
            document.getElementById('confirmIcon').innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:var(--neon-pink);"></i>`;
            document.getElementById('confirmTitle').innerText = "WARNING SYSTEM";
            document.getElementById('confirmMsg').innerHTML = `本当に <strong>【${name}】</strong> のカードを消去するんだな？`;
            document.getElementById('cyberConfirm').classList.add('active');
        }

        function closeCyberConfirm(isConfirmed) {
            document.getElementById('cyberConfirm').classList.remove('active');
            if (isConfirmed) {
                if (confirmContext === "delete_card" && pendingDeleteId) {
                    database.ref('members/' + pendingDeleteId).remove();
                } else if (confirmContext === "publish_news") {
                    const newsInput = document.getElementById('adminNewsInput');
                    const newText = newsInput.value.trim();
                    database.ref('live_news_flash').set({ text: "【速報】" + newText, timestamp: Date.now() })
                    .then(() => { newsInput.value = ''; document.getElementById('controlPanel').classList.remove('open'); });
                } else if (confirmContext === "clear_news") {
                    database.ref('live_news_flash').remove()
                    .then(() => { document.getElementById('controlPanel').classList.remove('open'); });
                } else if (confirmContext === "delete_chat" && pendingDeleteChatKey) {
                    database.ref('bbs_messages/' + pendingDeleteChatKey).remove();
                }
            }
            pendingDeleteId = null; pendingDeleteChatKey = null;
        }
    </script>
</body>
</html>
