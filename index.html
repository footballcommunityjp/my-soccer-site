<!DOCTYPE html> <html lang="ja"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>フットボールコミュニティJP</title> <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script> <style> :root { --bg-color: #030712; --text-color: #ffffff; --card-bg: rgba(6, 11, 25, 0.6); --neon-cyan: #00ffcc; --neon-pink: #ff007f; } body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; } .header { width: 100%; text-align: center; margin-bottom: 20px; } .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; max-width: 800px; } .card { background: var(--card-bg); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 12px; padding: 20px; width: 300px; position: relative; } /* 削除ボタンを右上に配置 */ .del-btn { position: absolute; top: 10px; right: 10px; background: rgba(255, 0, 0, 0.2); border: none; color: #ff4444; border-radius: 4px; padding: 4px 8px; font-size: 10px; cursor: pointer; display: none; } .admin-input-box { margin-bottom: 20px; padding: 10px; border-radius: 6px; border: 1px solid var(--neon-cyan); background: #000; color: #fff; } .btn { display: block; background: var(--neon-cyan); color: #000; text-align: center; padding: 10px; border-radius: 6px; text-decoration: none; font-weight: bold; margin-top: 10px; } </style> </head> <body> <div class="header"> <h1>⚽ COMMUNITY JP</h1> <input type="password" id="adminCodeInput" class="admin-input-box" placeholder="管理者コードを入力..." oninput="checkAdminCode()"> </div> <div class="container" id="mainContainer"></div> <script> const firebaseConfig = { databaseURL: "https://footballcommunityjp-default-rtdb.asia-southeast1.firebasedatabase.app/", projectId: "footballcommunityjp" }; firebase.initializeApp(firebaseConfig); const database = firebase.database(); const SECRET_ADMIN_CODE = "nitbskean"; // データ読み込み database.ref('members').on('value', (snapshot) => { const container = document.getElementById('mainContainer'); container.innerHTML = ''; const data = snapshot.val(); if(!data) return; Object.values(data).forEach(m => { const card = document.createElement('div'); card.className = 'card'; card.innerHTML = ` <button class="del-btn" onclick="deleteMember(${m.id})">DELETE</button> <h3>${m.name}</h3> <p>${m.username}</p> <a href="${m.tiktokUrl}" class="btn" target="_blank">TikTok</a> `; container.appendChild(card); }); }); // 削除ボタンの表示切り替え function checkAdminCode() { const input = document.getElementById('adminCodeInput').value; const btns = document.querySelectorAll('.del-btn'); btns.forEach(b => b.style.display = (input === SECRET_ADMIN_CODE) ? 'block' : 'none'); } // 削除処理 function deleteMember(id) { if(confirm("本当にこのメンバーを消すか？後戻りはできないぞ！")) { database.ref('members/' + id).remove(); } } </script> </body> </html>
