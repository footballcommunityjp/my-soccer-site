<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フットボールコミュニティJP</title>
    <style>
        /* 全体のデザイン（強者感のあるダークモード） */
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ヘッダー（タイトル部分） */
        .header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            box-sizing: border-box;
            border-bottom: 2px solid #00ffcc;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }

        .header p {
            margin: 10px 0 0 0;
            color: #94a3b8;
            font-size: 14px;
        }

        /* カードを並べるコンテナ */
        .container {
            max-width: 1200px;
            width: 100%;
            padding: 30px 20px;
            box-sizing: border-box;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        /* ここから紹介カードのデザイン */
        .card {
            background-color: #1e293b;
            border: 2px solid #00ffcc; /* 綺麗なネオンブルー */
            border-radius: 16px;
            overflow: hidden;
            width: 100%;
            max-width: 340px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .card-body {
            padding: 24px;
            text-align: center;
        }

        /* ★新・アイコンエリア（画像が無くてもサッカーボールが絶対に光る！） */
        .avatar-box {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid #00ffcc;
            background-color: #0f172a;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px; /* サッカーボールを大きく */
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }

        .name {
            font-size: 22px;
            font-weight: bold;
            margin: 0 0 4px 0;
            color: #ffffff;
        }

        .username {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* フォロワーなどの数字エリア */
        .stats {
            display: flex;
            justify-content: space-between;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .stat-item {
            flex: 1;
            text-align: center;
        }

        .stat-value {
            font-size: 16px;
            font-weight: bold;
            color: #00ffcc;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
        }

        /* 紹介文 */
        .bio {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            text-align: left;
            margin-bottom: 20px;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border-left: 4px solid #ff007f; /* アクセントのピンク */
        }

        /* ボタン */
        .btn {
            display: block;
            background-color: #00ffcc;
            color: #0f172a;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            padding: 12px;
            border-radius: 8px;
            transition: background-color 0.2s;
            margin-top: auto;
        }

        .btn:hover {
            background-color: #00ccaa;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚽ フットボールコミュニティJP ⚽</h1>
        <p>サッカー界隈の凄腕編集者やプレイヤー特設紹介サイト</p>
    </div>

    <div class="container">

        <div class="card">
            <div class="card-body">
                <div class="avatar-box">⚽</div>
                
                <div class="name">MENTAI</div>
                <div class="username">@mentaiko8351</div>
                
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value">304</div>
                        <div class="stat-label">フォロワー</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">1,332</div>
                        <div class="stat-label">いいね</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">189</div>
                        <div class="stat-label">フォロー中</div>
                    </div>
                </div>
                
                <div class="bio">
                    垢バンされた過去を持つサッカー編集者<br>
                    好きなサッカー選手: ルイス・スアレス
                </div>
                
                <a href="https://www.tiktok.com/@mentaiko8351" target="_blank" class="btn">TikTokアカウント</a>
            </div>
        </div>

    </div>

</body>
</html>
