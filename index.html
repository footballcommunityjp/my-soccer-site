<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>フットボールコミュニティJP - SUPER EXPERT</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ==========================================
           🎨 無茶クソ綺麗なテーマ・デザイン定義 (CSS)
           ========================================== */
        :root {
            --bg-color: #030712;
            --bg-gradient: radial-gradient(circle at 50% 0%, #0b1528 0%, #030712 100%);
            --grid-color: rgba(0, 255, 204, 0.02);
            --text-color: #ffffff;
            --card-bg: rgba(11, 22, 44, 0.5);
            --card-border: rgba(0, 255, 204, 0.15);
            --card-hover-border: #00ffcc;
            --sub-text: #64748b;
            --panel-bg: rgba(6, 11, 25, 0.96);
            --neon-cyan: #00ffcc;
            --neon-pink: #ff007f;
            --neon-blue: #0077ff;
            --glow-color: rgba(0, 255, 204, 0.3);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 🌌 ギャラクシー宇宙テーマ */
        [data-theme="galaxy"] {
            --bg-color: #0b001a;
            --bg-gradient: radial-gradient(circle at 50% 50%, #1a0033 0%, #050010 100%);
            --grid-color: rgba(255, 0, 127, 0.03);
            --text-color: #f3e8ff;
            --card-bg: rgba(30, 0, 60, 0.4);
            --card-border: rgba(216, 180, 254, 0.2);
            --card-hover-border: #d8b4fe;
            --sub-text: #a78bfa;
            --panel-bg: rgba(20, 0, 40, 0.98);
            --neon-cyan: #c084fc;
            --neon-pink: #f472b6;
            --neon-blue: #38bdf8;
            --glow-color: rgba(192, 132, 252, 0.4);
        }

        /* 🕶️ ディープダークテーマ */
        [data-theme="dark"] {
            --bg-color: #000000;
            --bg-gradient: none;
            --grid-color: rgba(255,255,255,0.01);
            --text-color: #ffffff;
            --card-bg: #0d0d0d;
            --card-border: #222222;
            --card-hover-border: #ffffff;
            --sub-text: #64748b;
            --panel-bg: #121212;
            --neon-cyan: #ffffff;
            --neon-pink: #444444;
            --neon-blue: #222222;
            --glow-color: rgba(255,255,255,0.1);
        }

        /* ☀️ スタイリッシュライトテーマ */
        [data-theme="light"] {
            --bg-color: #f8fafc;
            --bg-gradient: linear-gradient(#f1f5f9, #f8fafc);
            --grid-color: rgba(15, 23, 42, 0.02);
            --text-color: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(15, 23, 42, 0.08);
            --card-hover-border: #3b82f6;
            --sub-text: #64748b;
            --panel-bg: rgba(255, 255, 255, 0.98);
            --neon-cyan: #3b82f6;
            --neon-pink: #ec4899;
            --neon-blue: #06b6d4;
            --glow-color: rgba(59, 130, 246, 0.2);
        }

        /* 全体基礎スタイル */
        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient), linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding-bottom: 120px;
            overflow-x: hidden; transition: background 0.5s ease, color 0.5s ease;
            -webkit-tap-highlight-color: transparent;
        }

        /* 👑 超美麗サイバーヘッダー */
        .header-wrapper {
            width: 100%; background: rgba(3, 7, 18, 0.3);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            padding: 25px 20px; box-sizing: border-box;
            position: relative; z-index: 1000;
            display: flex; flex-direction: column; align-items: center; gap: 15px;
        }
        .header-main {
            display: flex; justify-content: center; align-items: center; width: 100%; position: relative;
        }
        .header-main h1 {
            margin: 0; font-size: 26px; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px var(--glow-color);
        }

        /* ⚙️ 設定ギアボタン */
        .settings-btn {
            position: absolute; right: 10px; background: none; border: none;
            color: var(--text-color); font-size: 22px; cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            padding: 8px; z-index: 1002;
        }
        .settings-btn:hover { transform: rotate(90deg) scale(1.1); color: var(--neon-cyan); }

        /* 🛡️ 超近未来コントロールセンター（設定パネル） */
        .control-panel {
            position: absolute; top: 80px; right: 20px; background: var(--panel-bg);
            border: 1px solid var(--card-border); border-radius: 16px; padding: 20px;
            width: 260px; box-sizing: border-box; display: none; flex-direction: column; gap: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 15px rgba(0, 255, 204, 0.05);
            z-index: 9999; animation: panelSlide 0.3s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .control-panel.open { display: flex; }
        @keyframes panelSlide { from { opacity: 0; transform: translateY(-10px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .panel-sec h4 { margin: 0 0 10px 0; font-size: 11px; color: var(--neon-cyan); letter-spacing: 1.5px; text-transform: uppercase; }
        .ui-group { display: flex; gap: 6px; }
        .ui-btn {
            background: rgba(255,255,255,0.03); border: 1px solid var(--card-border);
            color: var(--text-color); padding: 8px; border-radius: 8px; cursor: pointer;
            font-size: 11px; font-weight: 700; flex: 1; text-align: center; transition: all 0.2s;
        }
        .ui-btn.active { background: var(--neon-cyan); color: #030712; border-color: var(--neon-cyan); box-shadow: 0 0 12px var(--glow-color); }
        .secret-input { background: rgba(0,0,0,0.6); border: 1px solid var(--card-border); border-radius: 8px; padding: 8px; color: #fff; font-size: 12px; width: 100%; box-sizing: border-box; text-align: center; }

        /* 🔍 リアルタイム検索 ＆ タグ切り替えエリア */
        .search-filter-area {
            display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 500px; margin-top: 5px;
        }
        .search-box-wrapper { position: relative; width: 100%; }
        .search-box-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--sub-text); font-size: 14px; }
        .search-input {
            width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--card-border);
            padding: 12px 12px 12px 42px; box-sizing: border-box; border-radius: 30px;
            color: white; font-size: 14px; transition: all 0.3s ease;
        }
        .search-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0,255,204,0.15); outline: none; }
        
        /* 🏷️ タグフィルターボタン */
        .tag-filter-container { display: flex; justify-content: center; gap: 8px; overflow-x: auto; padding: 4px; width: 100%; }
        .tag-btn {
            background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; color: var(--sub-text);
            padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer;
            white-space: nowrap; transition: all 0.2s ease;
        }
        .tag-btn.active { background: rgba(0, 255, 204, 0.1); border-color: var(--neon-cyan); color: var(--neon-cyan); }

        /* 🗂️ メイングリッドコンテナ */
        .main-container {
            width: 100%; max-width: 1200px; padding: 40px 20px; box-sizing: border-box;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px;
            justify-content: center;
        }

        /* 🃏 アルティメット・サイバーカード */
        .member-card {
            background: var(--card-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border); border-radius: 20px; padding: 30px 24px;
            position: relative; display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); box-sizing: border-box;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.3s, box-shadow 0.4s;
            animation: cardEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .member-card:hover {
            transform: translateY(-10px) scale(1.02); border-color: var(--card-hover-border);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px var(--glow-color);
        }
        @keyframes cardEntrance { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

        /* 🏷️ カード内の役職タグ */
        .card-tag {
            position: absolute; top: 15px; left: 20px; font-size: 10px; font-weight: 800;
            background: rgba(0, 119, 255, 0.15); color: var(--neon-blue); border: 1px solid rgba(0, 119, 255, 0.3);
            padding: 3px 10px; border-radius: 10px; letter-spacing: 0.5px; text-transform: uppercase;
        }

        /* 🛠️ アクションボタン（削除・編集）エリア */
        .card-actions { position: absolute; top: 12px; right: 15px; display: none; gap: 6px; z-index: 10; }
        .action-icon-btn {
            background: rgba(0,0,0,0.4); border: 1px solid var(--card-border); width: 28px; height: 28px;
            border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px;
            cursor: pointer; transition: all 0.2s;
        }
        .action-icon-btn.edit { color: var(--neon-cyan); }
        .action-icon-btn.edit:hover { background: var(--neon-cyan); color: #000; }
        .action-icon-btn.del { color: var(--neon-pink); }
        .action-icon-btn.del:hover { background: var(--neon-pink); color: #fff; box-shadow: 0 0 10px var(--neon-pink); }

        /* 👤 アバター球体 */
        .avatar-sphere {
            width: 90px; height: 90px; border-radius: 50%; border: 2px solid var(--neon-cyan);
            background: #030712; display: flex; align-items: center; justify-content: center;
            font-size: 40px; box-shadow: 0 0 15px var(--glow-color); margin-top: 10px;
            background-size: cover; background-position: center; background-repeat: no-repeat;
            transition: transform 0.3s ease;
        }
        .member-card:hover .avatar-sphere { transform: scale(1.05) rotate(5deg); }

        .member-name { font-size: 22px; font-weight: 800; margin: 15px 0 0 0; letter-spacing: 0.5px; text-align: center; }
        .member-uid { font-size: 12px; color: var(--sub-text); margin: 4px 0 15px 0; font-family: monospace; }

        /* 📊 ステータス格子 */
        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(0, 0, 0, 0.25);
            width: 100%; border-radius: 12px; border: 1px solid rgba(255,255,255,0.03);
            margin-bottom: 20px; padding: 10px 0; position: relative;
        }
        .stat-box { text-align: center; position: relative; }
        .stat-box:not(:last-child)::after {
            content: ''; position: absolute; right: 0; top: 15%; height: 70%; width: 1px; background: rgba(255,255,255,0.08);
        }
        .stat-num { font-size: 15px; font-weight: 800; color: var(--neon-cyan); text-shadow: 0 0 8px var(--glow-color); }
        .stat-lbl { font-size: 9px; color: var(--sub-text); font-weight: bold; margin-top: 3px; letter-spacing: 0.5px; }

        /* 🔗 TikTok接続ボタン */
        .link-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue)); color: #030712;
            text-decoration: none; font-weight: 800; font-size: 13px; padding: 12px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.15); box-sizing: border-box; transition: all 0.3s ease;
        }
        .link-btn:hover { box-shadow: 0 0 25px var(--neon-cyan); transform: scale(1.02); }

        /* ➕ フローティングクリエイトボタン */
        .add-float-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%;
            background: linear-gradient(135deg, var(--neon-pink), #ff0055); border: 2px solid #ffffff;
            color: white; font-size: 26px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 0 25px rgba(255, 0, 127, 0.5); z-index: 999;
            opacity: 0; transform: scale(0) rotate(-90deg); pointer-events: none;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .add-float-btn.visible { opacity: 1; transform: scale(1) rotate(0deg); pointer-events: auto; }

        /* 🎬 ネオン・インプット・モーダル */
        .modal-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center; z-index: 100000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-mask.active { opacity: 1; pointer-events: auto; }
        .modal-window {
            background: var(--panel-bg); border: 1px solid var(--neon-cyan); border-radius: 20px;
            padding: 30px; width: 92%; max-width: 440px; box-shadow: 0 0 40px rgba(0, 255, 204, 0.2);
            box-sizing: border-box; max-height: 85vh; overflow-y: auto;
            transform: translateY(30px) scale(0.95); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .modal-mask.active .modal-window { transform: translateY(0) scale(1); }
        .modal-window h2 { margin: 0 0 25px 0; font-size: 20px; color: var(--neon-cyan); text-align: center; font-weight: 800; letter-spacing: 1px; }
        
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        .input-group label { font-size: 11px; color: var(--sub-text); font-weight: 800; letter-spacing: 0.5px; }
        .input-group input, .input-group select {
            background: rgba(0,0,0,0.5); border: 1px solid var(--card-border);
            border-radius: 8px; padding: 11px 14px; color: white; font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s; box-sizing: border-box;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--neon-cyan); box-shadow: 0 0 10px rgba(0,255,204,0.2); outline: none; }
        
        .actions-row { display: flex; gap: 12px; margin-top: 25px; }
        .form-btn { flex: 1; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; border: none; transition: all 0.2s; }
        .form-btn.back { background: #1e293b; color: #94a3b8; }
        .form-btn.go { background: var(--neon-cyan); color: #030712; }

        /* ==========================================
           🚨 復活・無茶クソ綺麗なカスタム確認ダイアログ (UI)
           ========================================== */
        .confirm-mask {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; align-items: center; justify-content: center; z-index: 200000;
            opacity: 0; pointer-events: none; transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .confirm-mask.active { opacity: 1; pointer-events: auto; }
        .confirm-window {
            background: #090d16; border: 2px solid var(--neon-pink); border-radius: 16px;
            padding: 24px; width: 90%; max-width: 360px; text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.25); box-sizing: border-box;
            transform: scale(0.9) translateY(20px); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .confirm-mask.active .confirm-window { transform: scale(1) translateY(0); }
        .confirm-icon { font-size: 42px; color: var(--neon-pink); margin-bottom: 15px; text-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
        .confirm-title { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 8px; }
        .confirm-msg { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 22px; }
        .confirm-actions { display: flex; gap: 10px; }
        .confirm-btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer; border: none; transition: all 0.2s; }
        .confirm-btn.no { background: #1e293b; color: #fff; }
        .confirm-btn.yes { background: linear-gradient(90deg, #ff0055, var(--neon-pink)); color: #fff; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3); }
        .confirm-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--sub-text); font-size: 14px; }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <div class="header-main">
            <h1>⚽ FOOTBALL COMMUNITY JP</h1>
            <button class="settings-btn" onclick="togglePanel()"><i class="fa-solid fa-sliders"></i></button>
        </div>

        <div class="control-panel" id="controlPanel">
            <div class="panel-sec">
                <h4><i class="fa-solid fa-lock"></i> Admin Authentication</h4>
                <input type="password" id="adminPass" class="secret-input" placeholder="コードを入力..." oninput="verifyAdmin()">
            </div>
            <div class="panel-sec">
                <h4><i class="fa-solid fa-arrow-down-wide-short"></i> Dynamic Sort</h4>
                <div class="ui-group">
                    <button class="ui-btn active" id="sort-idx" onclick="updateSort('default', this)">標準</button>
                    <button class="ui-btn" id="sort-fol" onclick="updateSort('followers', this)">人気</button>
                    <button class="ui-btn" id="sort-lk" onclick="updateSort('likes', this)">いいね</button>
                </div>
            </div>
            <div class="panel-sec">
                <h4><i class="fa-solid fa-palette"></i> Cyber Grid Theme</h4>
                <div class="ui-group" style="flex-wrap: wrap;">
                    <button class="ui-btn active" onclick="updateTheme('cyber', this)">NEON</button>
                    <button class="ui-btn" onclick="updateTheme('galaxy', this)">SPACE</button>
                    <button class="ui-btn" onclick="updateTheme('dark', this)">DARK</button>
                    <button class="ui-btn" onclick="updateTheme('light', this)">LIGHT</button>
                </div>
            </div>
        </div>

        <div class="search-filter-area">
            <div class="search-box-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchBar" class="search-input" placeholder="メンバー名やIDで瞬時に検索..." oninput="filterMembers()">
            </div>
            <div class="tag-filter-container">
                <button class="tag-btn active" onclick="filterTag('all', this)">ALL</button>
                <button class="tag-btn" onclick="filterTag('editor', this)">EDITOR</button>
                <button class="tag-btn" onclick="filterTag('player', this)">PLAYER</button>
                <button class="tag-btn" onclick="filterTag('other', this)">OTHER</button>
            </div>
        </div>
    </div>

    <div class="main-container" id="cardsGrid"></div>
    
    <button class="add-float-btn" id="addFloatBtn" onclick="launchModal()"><i class="fa-solid fa-plus"></i></button>

    <div class="modal-mask" id="memberModal">
        <div class="modal-window">
            <h2 id="modalTitle">NEW MEMBER CREATOR</h2>
            <input type="hidden" id="editTargetId">
            
            <div class="form-row">
                <div class="input-group">
                    <label>アバター (画像URL / 絵文字)</label>
                    <input type="text" id="formAvatar" value="⚽">
                </div>
                <div class="input-group">
                    <label>役割区分 (TAG)</label>
                    <select id="formTag">
                        <option value="editor">EDITOR</option>
                        <option value="player">PLAYER</option>
                        <option value="other">OTHER</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>名前 (NAME)</label>
                    <input type="text" id="formName" placeholder="ネイマール">
                </div>
                <div class="input-group">
                    <label>ユーザー名 (ID)</label>
                    <input type="text" id="formUser" placeholder="@neymarjr">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>フォロワー数 (半角数字)</label>
                    <input type="number" id="formFollowers" value="0">
                </div>
                <div class="input-group">
                    <label>フォロワー表示 (例: 50K)</label>
                    <input type="text" id="formFollowersTxt" value="0">
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label>いいね数 (半角数字)</label>
                    <input type="number" id="formLikes" value="0">
                </div>
                <div class="input-group">
                    <label>いいね表示 (例: 1.2M)</label>
                    <input type="text" id="formLikesTxt" value="0">
                </div>
            </div>

            <div class="input-group">
                <label>フォロー中カウント</label>
                <input type="text" id="formFollowing" value="0">
            </div>

            <div class="input-group">
                <label>TikTok プロフィールリンク</label>
                <input type="text" id="formUrl" value="https://www.tiktok.com/">
            </div>

            <div class="actions-row">
                <button class="form-btn back" onclick="dismissModal()">CANCEL</button>
                <button class="form-btn go" onclick="commitMemberData()">SAVE DATA</button>
            </div>
        </div>
    </div>

    <div class="confirm-mask" id="cyberConfirm">
        <div class="confirm-window">
            <div class="confirm-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="confirm-title">WARNING SYSTEM</div>
            <div class="confirm-msg" id="confirmMsg">本当にこのカードを消去するんだな？データベースからも跡形もなく消えるぜ。</div>
            <div class="confirm-actions">
                <button class="confirm-btn no" onclick="closeCyberConfirm(false)">CANCEL</button>
                <button class="confirm-btn yes" onclick="closeCyberConfirm(true)">DELETE</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔒 Firebase データベース初期設定
        // ==========================================
        const firebaseConfig = {
            databaseURL: "https://footballcommunityjp-default-rtdb.asia-southeast1.firebasedatabase.app/", 
            projectId: "footballcommunityjp"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const MASTER_CODE = "nitbskean";

        let localRawData = [];
        let activeSort = 'default';
        let activeTag = 'all';
        let pendingDeleteId = null; // 消去待ちのIDを一時キープする変数

        // 📦 Firebaseのデータ倉庫と同期
        database.ref('members').on('value', (snapshot) => {
            const val = snapshot.val();
            localRawData = val ? Object.values(val) : [];
            processAndRender();
        });

        function togglePanel() { document.getElementById('controlPanel').classList.toggle('open'); }

        function verifyAdmin() {
            const input = document.getElementById('adminPass').value;
            const floatBtn = document.getElementById('addFloatBtn');
            const actionAreas = document.querySelectorAll('.card-actions');

            if (input === MASTER_CODE) {
                floatBtn.classList.add('visible');
                actionAreas.forEach(a => a.style.display = 'flex');
            } else {
                floatBtn.classList.remove('visible');
                actionAreas.forEach(a => a.style.display = 'none');
            }
        }

        function updateTheme(theme, element) {
            if (theme === 'cyber') document.body.removeAttribute('data-theme');
            else document.body.setAttribute('data-theme', theme);
            element.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        function updateSort(criteria, element) {
            activeSort = criteria;
            processAndRender();
            element.parentElement.querySelectorAll('.ui-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        function filterTag(tag, element) {
            activeTag = tag;
            processAndRender();
            element.parentElement.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
        }

        function filterMembers() { processAndRender(); }

        function processAndRender() {
            let workingList = [...localRawData];
            if (activeTag !== 'all') workingList = workingList.filter(m => m.tag === activeTag);

            const keyword = document.getElementById('searchBar').value.toLowerCase().trim();
            if (keyword) {
                workingList = workingList.filter(m => 
                    (m.name && m.name.toLowerCase().includes(keyword)) || 
                    (m.username && m.username.toLowerCase().includes(keyword))
                );
            }

            if (activeSort === 'followers') workingList.sort((a, b) => (b.followers || 0) - (a.followers || 0));
            else if (activeSort === 'likes') workingList.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            else workingList.sort((a, b) => String(a.id).localeCompare(String(b.id)));

            const grid = document.getElementById('cardsGrid');
            grid.innerHTML = '';

            if (workingList.length === 0) {
                grid.innerHTML = '<div class="empty-state"><i class="fa-solid fa-folder-open" style="font-size:24px;margin-bottom:10px;"></i><br>該当するメンバーが見つからないぜ</div>';
                return;
            }

            workingList.forEach(m => {
                const isUrl = m.avatar && m.avatar.startsWith('http');
                const avatarStyle = isUrl ? `background-image: url('${m.avatar}');` : '';
                const avatarContent = isUrl ? '' : (m.avatar || "⚽");
                const tagLabel = m.tag || 'editor';

                const cardHtml = `
                    <div class="member-card">
                        <div class="card-tag">${tagLabel}</div>
                        <div class="card-actions">
                            <button class="action-icon-btn edit" onclick="initiateEdit('${m.id}')"><i class="fa-solid fa-pen"></i></button>
                            <button class="action-icon-btn del" onclick="openCyberConfirm('${m.id}', '${m.name}')"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        <div class="avatar-sphere" style="${avatarStyle}">${avatarContent}</div>
                        <div class="member-name">${m.name}</div>
                        <div class="member-uid">${m.username || '@username'}</div>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-num">${m.followersTxt || '0'}</div>
                                <div class="stat-lbl">フォロワー</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-num">${m.likesTxt || '0'}</div>
                                <div class="stat-lbl">いいね</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-num">${m.following || '0'}</div>
                                <div class="stat-lbl">フォロー</div>
                            </div>
                        </div>
                        <a href="${m.tiktokUrl || 'https://www.tiktok.com/'}" target="_blank" class="link-btn">
                            <i class="fa-brands fa-tiktok"></i> TikTok Profile
                        </a>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHtml);
            });
            verifyAdmin();
        }

        function launchModal() {
            document.getElementById('modalTitle').innerText = "NEW MEMBER CREATOR";
            document.getElementById('editTargetId').value = "";
            document.getElementById('formName').value = "";
            document.getElementById('formUser').value = "";
            document.getElementById('formAvatar').value = "⚽";
            document.getElementById('formFollowers').value = 0;
            document.getElementById('formFollowersTxt').value = "0";
            document.getElementById('formLikes').value = 0;
            document.getElementById('formLikesTxt').value = "0";
            document.getElementById('formFollowing').value = "0";
            document.getElementById('formUrl').value = "https://www.tiktok.com/";
            document.getElementById('memberModal').classList.add('active');
        }

        function initiateEdit(id) {
            const target = localRawData.find(m => String(m.id) === String(id));
            if (!target) return;

            document.getElementById('modalTitle').innerText = "MEMBER PROFILE EDITOR";
            document.getElementById('editTargetId').value = target.id;
            document.getElementById('formTag').value = target.tag || "editor";
            document.getElementById('formAvatar').value = target.avatar || "⚽";
            document.getElementById('formName').value = target.name || "";
            document.getElementById('formUser').value = target.username || "";
            document.getElementById('formFollowers').value = target.followers || 0;
            document.getElementById('formFollowersTxt').value = target.followersTxt || "0";
            document.getElementById('formLikes').value = target.likes || 0;
            document.getElementById('formLikesTxt').value = target.likesTxt || "0";
            document.getElementById('formFollowing').value = target.following || "0";
            document.getElementById('formUrl').value = target.tiktokUrl || "https://www.tiktok.com/";
            document.getElementById('memberModal').classList.add('active');
        }

        function dismissModal() { document.getElementById('memberModal').classList.remove('active'); }

        function commitMemberData() {
            const name = document.getElementById('formName').value.trim();
            if (!name) { alert("名前は必ず入力してくれ！"); return; }

            const existingId = document.getElementById('editTargetId').value;
            const targetId = existingId ? existingId : 'mem_' + Date.now();

            const pack = {
                id: targetId,
                tag: document.getElementById('formTag').value,
                avatar: document.getElementById('formAvatar').value.trim() || "⚽",
                name: name,
                username: document.getElementById('formUser').value.trim() || "@username",
                followers: parseInt(document.getElementById('formFollowers').value) || 0,
                followersTxt: document.getElementById('formFollowersTxt').value.trim() || "0",
                likes: parseInt(document.getElementById('formLikes').value) || 0,
                likesTxt: document.getElementById('formLikesTxt').value.trim() || "0",
                following: document.getElementById('formFollowing').value.trim() || "0",
                tiktokUrl: document.getElementById('formUrl').value.trim() || "https://www.tiktok.com/"
            };

            database.ref('members/' + targetId).set(pack)
            .then(() => dismissModal())
            .catch(err => alert("通信エラー: " + err.message));
        }

        // ==========================================
        // 🚨 カスタム確認ダイアログの制御ロジック
        // ==========================================
        function openCyberConfirm(id, name) {
            pendingDeleteId = id; // 削除対象を一時キープ
            document.getElementById('confirmMsg').innerHTML = `本当に <strong>【${name}】</strong> のカードを消去するんだな？<br>Firebaseのデータからも跡形もなく消えるぜ。`;
            document.getElementById('cyberConfirm').classList.add('active');
        }

        function closeCyberConfirm(isConfirmed) {
            document.getElementById('cyberConfirm').classList.remove('active');
            
            // DELETEが押され、かつ対象IDがある時だけ実行
            if (isConfirmed && pendingDeleteId) {
                database.ref('members/' + pendingDeleteId).remove();
            }
            pendingDeleteId = null; // 終わったらリセット
        }
    </script>
</body>
</html>
